<svg xmlns="http://www.w3.org/2000/svg" width="170" height="130" viewBox="0 0 170 130" role="img" aria-labelledby="spectrum-title spectrum-description"><title id="spectrum-title">Finite Gaussian spectra and a fixed Marchenko–Pastur target</title><desc id="spectrum-description">Separate seeded Gaussian illustration; n = 4096, p=n/2. The fixed curve is the limiting MP density at gamma=0.5. Shaded steps are computed bulk histograms. Rust stems mark the two actual largest sample eigenvalues; pale dashed guides mark fixed asymptotic locations 3.4125 and 4.2. Stem heights encode no density. Crossfades represent transitions between four computed sizes, not new intermediate data.</desc><path d="M12 110 L158 110" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 110 L12 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M41.2 110 L41.2 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M70.4 110 L70.4 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M99.6 110 L99.6 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M128.8 110 L128.8 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 110 L158 112.5" fill="none" opacity="1" stroke="#b8c3b9" stroke-width="0.65" stroke-linecap="round" stroke-linejoin="round"/><path d="M111.645 110 L111.645 78" fill="none" opacity="1" stroke-dasharray="2 2" stroke="#a7b6aa" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M114.145 78 L114.05981 78.64705 L113.81006 79.25 L113.41277 79.76777 L112.895 80.16506 L112.29205 80.41481 L111.645 80.5 L110.99795 80.41481 L110.395 80.16506 L1